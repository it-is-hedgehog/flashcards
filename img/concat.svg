<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 150" font-family="sans-serif" font-size="11">
  <text x="10" y="14" fill="#8a96a8" font-weight="bold">axis=0 — стопкой (вниз)</text>
  <rect x="10" y="22" width="60" height="26" rx="3" fill="#6ba8d8" opacity="0.85"/>
  <text x="40" y="39" fill="#fff" text-anchor="middle">A</text>
  <rect x="10" y="50" width="60" height="26" rx="3" fill="#90c890" opacity="0.85"/>
  <text x="40" y="67" fill="#fff" text-anchor="middle">B</text>
  <text x="80" y="55" fill="#8a96a8">→ длиннее (строки +)</text>
  <text x="10" y="100" fill="#8a96a8" font-weight="bold">axis=1 — боком (вправо)</text>
  <rect x="10" y="108" width="60" height="32" rx="3" fill="#6ba8d8" opacity="0.85"/>
  <text x="40" y="128" fill="#fff" text-anchor="middle">A</text>
  <rect x="74" y="108" width="60" height="32" rx="3" fill="#90c890" opacity="0.85"/>
  <text x="104" y="128" fill="#fff" text-anchor="middle">B</text>
  <text x="144" y="128" fill="#8a96a8">→ шире (колонки +)</text>
</svg>
